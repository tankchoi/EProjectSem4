<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Hóa đơn</title>
    <link rel="stylesheet" th:href="@{/assets/css/admin/pages/receipt/index.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/fragments/nav-side.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/fragments/nav-top.css}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for receipt edit */
        .form-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            margin: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-label.required::after {
            content: " *";
            color: #dc2626;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            background: white;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input:read-only {
            background-color: #f8fafc;
            color: #6b7280;
        }

        .form-input.success {
            border-color: #10b981;
            background-color: #f0fdf4;
        }

        .form-input.error {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .form-help {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        .form-error {
            color: #dc2626;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            font-style: italic;
        }

        .info-box {
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-box.info {
            background-color: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1d4ed8;
        }

        .info-box.success {
            background-color: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .info-box.error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            background-color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            color: #3b82f6;
            text-decoration: none;
        }

        .btn-secondary:hover {
            color: #1d4ed8;
        }

        .add-btn {
            display: flex;
            gap: 0.75rem;
        }

        .add-btn .btn {
            background: white;
            color: #667eea;
            border: 2px solid white;
        }

        .add-btn .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .form-container {
                margin: 1rem;
                padding: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div th:replace="admin/fragments/nav-side :: nav-side"></div>
        <div th:replace="admin/fragments/nav-top :: nav-top"></div>
        <div class="page-container">
            <div class="page-header">
                <div class="header-content">
                    <h1>Admin /</h1>
                    <h1>Quản lý Hóa đơn</h1>
                </div>
            </div>
            <div class="dashboard-header">
                <div class="dashboard-title">
                    <h1>Cập nhật Hóa đơn #<span th:text="${invoice.id}"></span></h1>
                    <a th:href="@{/admin/invoice}" class="btn btn-secondary">
                        <span class="material-symbols-outlined">arrow_back</span>
                        Quay lại
                    </a>
                </div>
            </div>

            <!-- Alert messages -->
            <div th:if="${success}" class="info-box success">
                <span class="material-symbols-outlined">check_circle</span>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="info-box error">
                <span class="material-symbols-outlined">error</span>
                <span th:text="${error}"></span>
            </div>

            <div class="form-container">
                <form th:action="@{/admin/invoice/update}" th:object="${invoiceDto}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label class="form-label" for="requestInfo">
                            Yêu cầu bảo hành
                        </label>
                        <input type="text" id="requestInfo" class="form-input" readonly
                            th:value="${'#' + invoice.request.id + ' - ' + invoice.request.fullname + ' (' + invoice.request.customerLaptop.laptop.name + ')'}">
                        <div class="info-box info">
                            <span class="material-symbols-outlined">info</span>
                            Không thể thay đổi yêu cầu bảo hành khi chỉnh sửa hóa đơn
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="totalPrice">
                            Tổng tiền (VNĐ)
                        </label>
                        <input type="text" id="totalPrice" class="form-input" readonly
                            th:value="${#numbers.formatInteger(invoice.totalPrice, 0, 'COMMA')} + ' VNĐ'">
                        <div class="info-box info">
                            <span class="material-symbols-outlined">info</span>
                            Tổng tiền được tính tự động từ các linh kiện trong yêu cầu bảo hành
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label required" for="status">
                            Trạng thái thanh toán
                        </label>
                        <select th:field="*{status}" id="status" class="form-select" required>
                            <option value="UNPAID">Chưa thanh toán</option>
                            <option value="PAID">Đã thanh toán</option>
                        </select>
                        <div th:if="${#fields.hasErrors('status')}" class="form-error">
                            <span th:errors="*{status}"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/admin/invoice}" class="btn btn-secondary">
                            <span class="material-symbols-outlined">close</span>
                            Hủy
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <span class="material-symbols-outlined">save</span>
                            Cập nhật Hóa đơn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/assets/js/admin/script.js}"></script>
</body>

</html>
