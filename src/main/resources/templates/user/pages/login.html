<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" th:href="@{/assets/css/user/login.css}">


    <title>Document</title>
</head>

<body>
    <div class="wrapper-login">
        <div class="form-header">
            <div class="titles">
                <div class="title-login">Đăng Nhập</div>
            </div>
        </div>
        <!-- LOGIN FORM -->
        <form th:action="@{/custom-login}" method="post" class="login-form" autocomplete="off">
            <div class="input-box">
                <input type="text" class="input-field" name="username" placeholder="Nhập tên đăng nhập">
                <i class='bx bx-user icon'></i> 
            </div>
            <div class="input-box">
                <input type="password" class="input-field" name="password" placeholder="Nhập mật khẩu">
                <i class='bx bx-lock-alt icon'></i>
            </div>
            <div th:if="${param.error}" style="color: red; margin-bottom:10px;">
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
            <div class="form-cols">
                <div class="col-1"></div>
                <div class="col-2">
                    <a href="#">Quên mật khẩu?</a>
                </div>
            </div>
            <div class="input-box">
                <button class="btn-submit" id="SignInBtn" type="submit">Đăng nhập <i class='bx bx-log-in'></i></button>
            </div>
            <div class="switch-form">
                <span>Bạn chưa có tài khoản? <a href="/register">Đăng ký</a></span>
            </div>
        </form>
    </div>

</body>

</html>
