<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" th:href="@{/assets/css/user/login.css}">


    <title>Document</title>
</head>

<body>
    <div class="wrapper-register">
        <div class="form-header">
            <div class="titles">
                <div class="title-register">Đăng Ký</div>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <form action="/register" method="post" class="register-form" autocomplete="off" th:object="${registerDTO}">
            <div class="input-box">
                <input type="text" th:field="*{username}" class="input-field" placeholder="Nhập tên đăng nhập" >
                <i class='bx bx-user icon'></i>
            </div>
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="margin: 5px 0 5px; color: red;"></p>

            <div class="input-box">
                <input type="text" th:field="*{email}" class="input-field" placeholder="Nhập email">
                <i class='bx bx-envelope icon'></i>
            </div>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="margin: 5px 0 5px; color: red;"></p>

            <div class="input-box">
                <input type="password" th:field="*{password}" class="input-field" placeholder="Nhập mật khẩu">
                <i class='bx bx-lock-alt icon'></i>
            </div>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="margin: 5px 0 5px; color: red;"></p>

            <div class="form-cols">
                <div class="col-1">
                    <input type="checkbox" id="agree">
                    <label for="agree"> Tôi đồng ý với các điều khoản và điều kiện</label>
                </div>
                <div class="col-2"></div>
            </div>
            <div class="input-box">
                <button class="btn-submit" id="SignUpBtn" type="submit">Đăng ký <i class='bx bx-user-plus'></i></button>
            </div>
            <div class="switch-form">
                <span>Đã có tài khoản? <a href="/custom-login">Đăng nhập</a></span>
            </div>
        </form>
    </div>

</body>

</html>
