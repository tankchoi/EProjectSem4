<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/assets/css/user/information.css}">
    <link rel="stylesheet" th:href="@{/assets/css/user/footer.css}">
    <link rel="stylesheet" th:href="@{/assets/css/user/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>

</head>

<body>
    <div th:replace="user/fragments/header :: header"></div>
    <div class="profile-container">
        <div class="profile-info">
            <div class="profile-header">
                <h2>Thay đổi thông tin</h2>
            </div>
            <div class="form-group">
                <label>Tên người dùng:</label>
                <input type="text" placeholder="Nhập tên người dùng">
            </div>

            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" placeholder="Nhập tên đầy đủ">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="text" placeholder="Nhập email của bạn">
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" placeholder="Nhập số điện thoại của bạn">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" checked> Nam</label>
                    <label><input type="radio" name="gender"> Nữ</label>
                    <label><input type="radio" name="gender"> Khác</label>
                </div>
            </div>
            <button class="save-btn">Lưu</button>
        </div>

        <div class="profile-photo">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="avatar">
            <div class="upload-btn">
                <label for="file-upload" class="upload-label">Chọn hình ảnh</label>
                <input id="file-upload" type="file" accept="image/png, image/jpeg">
            </div>
            <p class="note">Kích thước tệp tối đa: 1 MB<br>Định dạng: .JPEG, .PNG</p>
        </div>
    </div>
    <div th:replace="user/fragments/footer :: footer"></div>
</body>

</html>
