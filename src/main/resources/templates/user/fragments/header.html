<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Header HP</title>
    <link rel="stylesheet" th:href="@{/assets/css/user/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
</head>

<body>
<header class="header">
    <div class="header-container">
        <div class="logo">
            <img src="/images/2048px-HP_logo_2012.svg.png" alt="HP Logo">
            <nav class="nav-links">
                <a href="/homepage">Trang chủ</a>
                <a href="/contact">Liên hệ</a>
            </nav>
        </div>

        <div class="search-login">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm hỗ trợ">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- Nếu chưa đăng nhập -->
            <div sec:authorize="!isAuthenticated()">
                <a href="/custom-login" class="login-btn">Đăng nhập</a>
            </div>

            <!-- Nếu đã đăng nhập -->
            <div sec:authorize="isAuthenticated()" class="user-info">
                <span th:text="'Xin chào, ' + ${#authentication.name}"></span>
                <a href="/logout" class="logout-btn">Đăng xuất</a>
            </div>
        </div>
    </div>
</header>
</body>
</html>
